<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盲派排盘</title>
<meta name="theme-color" content="#4a7ebb">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* 排盘 UI 样式(纯原生,无外部依赖) */
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #f5f6f8; color: #2b2b2b; font-size: 14px;
}
#app { max-width: 980px; margin: 0 auto; }
h1 { font-size: 20px; margin: 8px 0 16px; }
h1 small { font-size: 12px; color: #888; font-weight: normal; margin-left: 8px; }
h2 { font-size: 15px; margin: 0 0 10px; border-left: 4px solid #4a7ebb; padding-left: 8px; }
h2 small { font-size: 12px; color: #888; font-weight: normal; }

form { background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; padding: 12px 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 8px 0; }
label { display: flex; align-items: center; gap: 4px; }
label.inline { font-weight: normal; }
input[type=number], input[type=text], select {
  padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
}
input[type=number] { width: 64px; }
#city { width: 220px; }
button {
  padding: 6px 28px; font-size: 15px; background: #4a7ebb; color: #fff;
  border: none; border-radius: 4px; cursor: pointer;
}
button:hover { background: #3a6da8; }
.muted { color: #999; font-size: 12px; }
.error { color: #c0392b; }

.city-box { position: relative; }
.dropdown {
  position: absolute; top: 100%; left: 64px; z-index: 10; min-width: 260px;
  background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.dropdown div { padding: 6px 10px; cursor: pointer; }
.dropdown div:hover { background: #eef3fa; }
.dropdown .sub { color: #999; font-size: 12px; margin-left: 6px; }

section {
  background: #fff; border: 1px solid #e3e5e8; border-radius: 8px;
  padding: 14px 16px; margin-top: 14px;
}
section.feature { border-color: #4a7ebb; }

table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: center; }
th { background: #f0f3f7; }
td.gz, td.big { font-size: 20px; font-weight: bold; }
tr.covered td { color: #bbb; text-decoration: line-through; }
tr.boundary td { background: #f8f9fb; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 12px; }
.tag.ok { background: #e6f4e6; color: #2a7a2a; }
.tag.cover { background: #fbe6e6; color: #b03a3a; }
.tag.plain { background: #ececec; color: #666; }
a.jump { font-size: 13px; font-weight: normal; margin-left: 12px; color: #4a7ebb; text-decoration: none; }
a.jump:hover { text-decoration: underline; }
.via { color: #8a6d3b; font-size: 12px; }
.bazi-big { font-size: 26px; font-weight: bold; letter-spacing: 6px; margin: 6px 0; }
.cards { display: flex; gap: 12px; flex-wrap: wrap; }
.card { border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 14px; min-width: 200px; flex: 1; }
.card .gz { font-size: 22px; font-weight: bold; }
footer { margin: 18px 0 8px; }
.wxbar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; margin: 6px 0 10px; }
.wxbar div { color: #fff; font-size: 11px; text-align: center; line-height: 18px; }

/* 手机端适配(PWA): 窄屏堆叠、表格横滑、触屏输入 */
@media (max-width: 640px) {
  body { padding: 8px; font-size: 13px; }
  h1 { font-size: 16px; }
  h1 small { display: block; margin: 4px 0 0; }
  .row { gap: 8px 10px; }
  label { flex-wrap: wrap; }
  input[type=number] { width: 56px; padding: 6px 4px; font-size: 15px; }
  input[type=text], input[type=search], select { padding: 6px 4px; font-size: 15px; max-width: 100%; }
  input[type=search] { width: 100%; }
  button { padding: 8px 24px; font-size: 15px; }
  section { overflow-x: auto; padding: 10px; }
  th, td { padding: 4px 5px; font-size: 12px; white-space: nowrap; }
  .bazi-big { font-size: 20px; letter-spacing: 2px; }
  .card { min-width: 130px; padding: 8px 10px; }
  .via { font-size: 11px; }
  .dropdown { left: 8px; right: 8px; min-width: 0; } /* 搜索下拉铺满手机宽度 */
}

/* ===== 十二神页面(gods12.html) ===== */
.tabbtn {
  padding: 6px 18px; font-size: 14px; background: #fff; color: #4a7ebb;
  border: 1px solid #4a7ebb; border-radius: 4px; cursor: pointer;
}
.tabbtn:hover { background: #eef3fa; }
.tabbtn.on { background: #4a7ebb; color: #fff; }
.card.dcard { min-width: 84px; flex: 0 0 auto; cursor: pointer; text-align: center; }
.card.dcard:hover { border-color: #4a7ebb; }
.card.dcard.sel { border-color: #4a7ebb; background: #eef3fa; box-shadow: 0 0 0 1px #4a7ebb inset; }
.shenchips span { display: inline-block; margin: 2px 6px 2px 0; }

/* 十二神页面: 命盘八字五行着色(色值同 app.js 五行统计条 WX_COLOR,与蓝白主题协调) */
.wx-mu { color: #3d8b37; }   /* 木 绿 */
.wx-huo { color: #c0392b; }  /* 火 红 */
.wx-tu { color: #8d6e4a; }   /* 土 土色 */
.wx-jin { color: #b8860b; }  /* 金 金色 */
.wx-shui { color: #3a6ea5; } /* 水 蓝 */
/* 命盘三排(横排): 左侧小标签,右侧四字 flex 均匀横排,五行着色保留 */
.pan3row { display: flex; align-items: baseline; gap: 8px 28px; margin: 6px 0; }
.pan3row .pan3label { flex: 0 0 52px; color: #888; font-size: 13px; }
.pan3row .gz3 { font-size: 26px; font-weight: bold; min-width: 40px; text-align: center; }
.pan3row .gz3s { font-size: 18px; font-weight: bold; min-width: 64px; text-align: center; }

</style>
</head>
<body>
<div id="app">
  <h1>盲派排盘 <small>默认启用纬度调整月令</small></h1>

  <form id="form" onsubmit="return false;">
    <div class="row">
      <label>历法
        <select id="mode">
          <option value="solar" selected>公历</option>
          <option value="lunar">农历</option>
        </select>
      </label>
      <label><input id="yy" type="number" value="1977"> 年</label>
      <label><input id="mm" type="number" value="9"> 月</label>
      <label><input id="dd" type="number" value="28"> 日</label>
      <label><input id="hh" type="number" value="10" min="0" max="23"> 时</label>
      <label><input id="mi" type="number" value="0" min="0" max="59"> 分</label>
      <label id="leapWrap" style="display:none"><input id="leap" type="checkbox"> 闰月</label>
    </div>
    <div class="row">
      <label>性别
        <label class="inline"><input type="radio" name="gender" value="男" checked> 男</label>
        <label class="inline"><input type="radio" name="gender" value="女"> 女</label>
      </label>
      <label>国家
        <select id="country">
          <option value="cn" selected>中国</option>
          <option value="manual">其他(手动经纬度)</option>
        </select>
      </label>
      <label>省 <select id="prov"></select></label>
      <label>市 <select id="cityS"></select></label>
      <label>区/县 <select id="dist"></select></label>
      <label class="city-box">搜索 <input id="citySearch" type="search" placeholder="输入城市/区县名或拼音,如: 成都 / chengdu" autocomplete="off"></label>
      <div id="searchList" class="dropdown" style="display:none"></div>
      <span id="cityInfo" class="muted"></span>
      <div id="manualWrap" style="display:none" class="row">
        <label>经度 <input id="lonIn" type="number" step="0.0001" placeholder="东经,如 104.06"></label>
        <label>纬度 <input id="latIn" type="number" step="0.0001" placeholder="北纬,如 30.67"></label>
      </div>
    </div>
    <div class="row">
      <label><input id="zwz" type="checkbox" checked> 区分晚子时(23:00-24:00日柱按当日,时柱按次日)</label>
      <label><input id="zty" type="checkbox"> 真太阳时校正 <span class="muted">(仅定日、时柱；默认关)</span></label>
      <label><input id="blindPaipanTechnique" type="checkbox" checked> 盲派排盘技法 <span class="muted">(纬度调整月令)</span></label>
      <button id="submit" type="submit">排盘</button>
      <span id="error" class="error"></span>
    </div>
  </form>

  <div id="result" style="display:none">
    <section><h2>基本信息 <a id="toGods12" class="jump" href="#" style="display:none">串宫押运十二神 →</a></h2><div id="secBasic"></div></section>
    <section><h2>四柱</h2><div id="secPillars"></div></section>
    <section class="feature"><h2>节令口径 <small>启用盲派排盘技法时显示纬度调整月令过程</small></h2><div id="secJieqi"></div></section>
    <section><h2>胎元 / 命宫 / 身宫</h2><div id="secPalaces"></div></section>
    <section><h2>大运</h2><div id="secDayun"></div></section>
    <section><h2>刑冲合害</h2><div id="secGX"></div></section>
    <section><h2>神煞</h2><div id="secShensha"></div></section>
    <section><h2>五行阴阳统计</h2><div id="secStat"></div></section>
  </div>

  <footer class="muted">
    历法天文算法;城市库同源;盲派排盘技法。
  </footer>
</div>

                f = ty - f;
            }
            if (flag == 2) {
                f = 2 * ty - f;
            }
            peri[i] = f;
        }
        for (var i = 1; i <= 24; i++) {
            jdez[i - 1] = jdve + peri[i] - peri[1];
        }
        return jdez;
    };
    /**
     * 地球在繞日运行時會因受到其他星球之影響而產生攝動(perturbation)
     * @param float jdez Julian day
     * @return number 返回某时刻(儒略日历)的攝動偏移量
     */
    this.Perturbation = function(jdez) {
        var jdez = this.floatval(jdez);
        var ptsa = [485, 203, 199, 182, 156, 136, 77, 74, 70, 58, 52, 50, 45, 44, 29, 18, 17, 16, 14, 12, 12, 12, 9, 8];
        var ptsb = [324.96, 337.23, 342.08, 27.85, 73.14, 171.52, 222.54, 296.72, 243.58, 119.81, 297.17, 21.02, 247.54, 325.15, 60.93, 155.12, 288.79, 198.04, 199.76, 95.39, 287.11, 320.81, 227.73, 15.45];
        var ptsc = [1934.136, 32964.467, 20.186, 445267.112, 45036.886, 22518.443, 65928.934, 3034.906, 9037.513, 33718.147, 150.678, 2281.226, 29929.562, 31555.956, 4443.417, 67555.328, 4562.452, 62894.029, 31436.921, 14577.848, 31931.756, 34777.259, 1222.114, 16859.074];
        var t = (jdez - 2451545) / 36525;
        var s = 0;
        for (var k = 0; k <= 23; k++) {
            s = s + ptsa[k] * Math.cos(ptsb[k] * 2 * Math.PI / 360 + ptsc[k] * 2 * Math.PI / 360 * t);
        }
        var w = 35999.373 * t - 2.47;
        var l = 1 + 0.0334 * Math.cos(w * 2 * Math.PI / 360) + 0.0007 * Math.cos(2 * w * 2 * Math.PI / 360);
        return 0.00001 * s / l;
    };
    /**
     * 求∆t
     * @param int yy 公历年份
     * @param int mm 公历月份,可能为负数
     * @return number 单位为分钟
     */
    this.DeltaT = function(yy, mm) {
        var yy = this.intval(yy);
        var mm = this.intval(mm);

        var u, t, dt, y;
        y = yy + (mm - 0.5) / 12;
        if (y <= -500) {
            u = (y - 1820) / 100;
            dt = (-20 + 32 * u * u);
        } else {
            if (y < 500) {
                u = y / 100;
                dt = (10583.6 - 1014.41 * u + 33.78311 * u * u - 5.952053 * u * u * u - 0.1798452 * u * u * u * u + 0.022174192 * u * u * u * u * u + 0.0090316521 * u * u * u * u * u * u);
            } else {
                if (y < 1600) {
                    u = (y - 1000) / 100;
                    dt = (1574.2 - 556.01 * u + 71.23472 * u * u + 0.319781 * u * u * u - 0.8503463 * u * u * u * u - 0.005050998 * u * u * u * u * u + 0.0083572073 * u * u * u * u * u * u);
                } else {
                    if (y < 1700) {
                        t = y - 1600;
                        dt = (120 - 0.9808 * t - 0.01532 * t * t + t * t * t / 7129);
                    } else {
                        if (y < 1800) {
                            t = y - 1700;
                            dt = (8.83 + 0.1603 * t - 0.0059285 * t * t + 0.00013336 * t * t * t - t * t * t * t / 1174000);
                        } else {
                            if (y < 1860) {
                                t = y - 1800;
                                dt = (13.72 - 0.332447 * t + 0.0068612 * t * t + 0.0041116 * t * t * t - 0.00037436 * t * t * t * t + 0.0000121272 * t * t * t * t * t - 0.0000001699 * t * t * t * t * t * t + 0.000000000875 * t * t * t * t * t * t * t);
                            } else {
                                if (y < 1900) {
                                    t = y - 1860;
                                    dt = (7.62 + 0.5737 * t - 0.251754 * t * t + 0.01680668 * t * t * t - 0.0004473624 * t * t * t * t + t * t * t * t * t / 233174);
                                } else {
                                    if (y < 1920) {
                                        t = y - 1900;
                                        dt = (-2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t * t * t - 0.000197 * t * t * t * t);
                                    } else {
                                        if (y < 1941) {
                                            t = y - 1920;
                                            dt = (21.2 + 0.84493 * t - 0.0761 * t * t + 0.0020936 * t * t * t);
                                        } else {
                                            if (y < 1961) {
                                                t = y - 1950;
                                                dt = (29.07 + 0.407 * t - t * t / 233 + t * t * t / 2547);
                                            } else {
                                                if (y < 1986) {
                                                    t = y - 1975;
                                                    dt = (45.45 + 1.067 * t - t * t / 260 - t * t * t / 718);
                                                } else {
                                                    if (y < 2005) {
                                                        t = y - 2000;
                                                        dt = (63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t * t * t + 0.000651814 * t * t * t * t + 0.00002373599 * t * t * t * t * t);
                                                    } else {
                                                        if (y < 2050) {
                                                            t = y - 2000;
                                                            dt = (62.92 + 0.32217 * t + 0.005589 * t * t);
                                                        } else {
                                                            if (y < 2150) {
                                                                u = (y - 1820) / 100;
                                                                dt = (-20 + 32 * u * u - 0.5628 * (2150 - y));
                                                            } else {
                                                                u = (y - 1820) / 100;
                                                                dt = (-20 + 32 * u * u);
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        if (y < 1955 || y >= 2005) {
            dt = dt - (0.000012932 * (y - 1955) * (y - 1955));
        }
        return dt / 60; //將秒轉換為分
    };
    /**
     * 获取指定公历年對Perturbaton作調整後的自春分點開始的24節氣,1645年农历七月及之前为<授时历>,八月开始启用传教士汤若望的<时宪历>,与现代天文算法存在误差,此处依据寿星万年历进行修正
     * @param int yy(-1000-3000)
	 * @param bool calendar 是否根据黄历进行调整,调整后精度为日(仅用于农历计算)
     * @return array this.jq[i%24]
     */
    this.GetAdjustedJQ = function(yy, calendar) {
        var yy = this.intval(yy);
		var calendar = calendar ? 1 : 0;
		
        if(this.JQ[yy] == undefined){
            this.JQ[yy] = [];
        }
		if(this.JQ[yy][0] == undefined){ //必须要有0
			var jdjq = [];
			var jdez = this.MeanJQJD(yy); //輸入指定年,求該回歸年各節氣点
			for (var i = 0; i < 24; i++) {
				var ptb = this.Perturbation(jdez[i]); //取得受perturbation影響所需微調
				var dt = this.DeltaT(yy, Math.ceil(i / 2) + 3); //修正dynamical time to Universal time
				jdjq[i] = jdez[i] + ptb - dt / 60 / 24; //加上攝動調整值ptb得到動態時間dynamical time or ephemeris days,減去對應的Delta T值(分鐘轉換為日)得到True Universal time
				jdjq[i] = jdjq[i] + 8 / 24; //因中國時間比格林威治時間先行8小時,即1/3日(由于农历基于此数据,此处必须为北京时间)
			}
			this.JQ[yy][0] = jdjq;
		}
		if(this.JQ[yy][calendar]){ //如果是0此处必返回
            return this.JQ[yy][calendar].slice(0);
        }
        
		var refer = true; //reference 如果无需修正则1直接引用0的
		var jdjq = this.JQ[yy][0].slice(0); //打破引用
		if(calendar == 1){ //古代农历模块完全来自寿星万年历
			var B = this.qiKB; //气直线拟合参数
			var pc = 7; //两气之间15天左右,7为中间偏一点以便找到最近的
			var f1 = B[0] - pc; //1640650.479938 - 7, -221-11-09 h=0.01709 古历·秦汉开始至没有天文算法(定气定朔)之前,古人采取平气平朔的方法,各朝代改动较大,许老师从繁杂的古历中提取数据进行分析而得到算法,致敬!
			var	f2 = B[B.length - 1] - pc; //1645-09-21 - 7 这之后采取徐光启与传教士汤若望合著的时宪历法,与现代天文算法仅存在最多上下一天的误差,所以简单采取修正表修正
			var	f3 = 2436935; //1960年01月01日12時00分00秒,这之后采取现代天文算法
			if (((jdjq[0] >= f1) && (jdjq[0] < f2)) || ((jdjq[23] >= f1) && (jdjq[23] < f2))) { //处于平气计算区间
				refer = false; //标志不能进行引用
				for(var i = 0,j = 0; j < 24; j++){ //逐个进行修正
					if((jdjq[j] < f1) || (jdjq[j] >= f2)){ //此时刻不在计算区间
						continue;
					}
					if(jdjq[j] + pc >= B[i + 2]){ //跨越了不同的历法
						for (; i < B.length; i += 2) {
							if (jdjq[j] + pc < B[i + 2]) {
								break;
							}
						}
					}
					
					jdjq[j] = B[i] + B[i + 1] * Math.floor((jdjq[j] + pc - B[i]) / B[i + 1]);
					jdjq[j] = Math.floor(jdjq[j] + 0.5);
					if (jdjq[j] == 1683460) {
						jdjq[j]++; //如果使用太初历计算-103年1月24日的朔日,结果得到的是23日,这里修正为24日(实历).修正后仍不影响-103的无中置闰.如果使用秦汉历,得到的是24日,本行D不会被执行.
					}
				}
			}
			for(var i in this.jqXFu[yy]){ //时宪历修正表,上面平气跑出来的不会来这里
				refer = false; //标志不能进行引用
				jdjq[i] += this.jqXFu[yy][i];
				jdjq[i] = Math.floor(jdjq[i] + 0.5); //修正后精度为日
			}
		}

		this.JQ[yy][calendar] = refer ? this.JQ[yy][0] : jdjq;
        
		return jdjq;
    };
    /**
     * 對於指定日期時刻所屬的朔望月,求出其均值新月點的月序數或时刻
     * @param float jd
	 * @param bool return_k 是否仅返回月序数
     * @return int/float
     */
    this.MeanNewMoon = function(jd, return_k) {
        var jd = this.floatval(jd);

        //k為從2000年1月6日14時20分36秒起至指定年月日之陰曆月數,以synodic month為單位
        var k = Math.floor((jd - 2451550.09765) / this.synmonth); //2451550.09765為2000年1月6日14時20分36秒之JD值,此為2000年後的第一個均值新月
		if(return_k){
			return k;
		}
        var jdt = 2451550.09765 + k * this.synmonth;

        var t = (jdt - 2451545) / 36525; //以100年為單位,以2000年1月1日12時為0點
        var pt = jdt + 0.0001337 * t * t - 0.00000015 * t * t * t + 0.00000000073 * t * t * t * t; //mean time of phase

        return pt;
    };

			var	f2 = B[B.length - 1] - pc; //1947168.00 - 7, 619-01-21 古人很早就知道用天文算法进行定朔了
			var	f3 = 2436935; //1960年01月01日12時00分00秒,这之后采取现代天文算法
			if ((jd >= f1) && (jd < f2)) { //处于平朔计算区间

					if (jd + pc < B[i + 2]) {

					}
				}
				var jdt = B[i] + B[i + 1] * Math.floor((jd + pc - B[i]) / B[i + 1]);
				jdt = Math.floor(jdt + 0.5);
				if (jdt == 1683460) {
					jdt++; //如果使用太初历计算-103年1月24日的朔日,结果得到的是23日,这里修正为24日(实历).修正后仍不影响-103的无中置闰.如果使用秦汉历,得到的是24日,本行D不会被执行.
				}	
				
				return jdt;
			}
		}
		
		var k = this.MeanNewMoon(jd, true); //+ 0,0.25,0.5,0.75分別對應新月,上弦月,滿月,下弦月
        var jdt = 2451550.09765 + k * this.synmonth;
        var t = (jdt - 2451545) / 36525; //2451545為2000年1月1日正午12時的JD
        var t2 = t * t; //square for frequent use
        var t3 = t2 * t; //cube for frequent use
        var t4 = t3 * t; //to the fourth
        //mean time of phase
        var pt = jdt + 0.0001337 * t2 - 0.00000015 * t3 + 0.00000000073 * t4;

        var m = 2.5534 + 29.10535669 * k - 0.0000218 * t2 - 0.00000011 * t3;

        apt1 += 0.00038 * es * Math.sin((Math.PI / 180) * (m - 2 * f));

        apt1 += 0.00004 * Math.sin((Math.PI / 180) * (3 * m));
        apt1 += 0.00003 * Math.sin((Math.PI / 180) * (mprime + m - 2 * f));
        apt1 += 0.00003 * Math.sin((Math.PI / 180) * (2 * mprime + 2 * f));
        apt1 -= 0.00003 * Math.sin((Math.PI / 180) * (mprime + m + 2 * f));
        apt1 += 0.00003 * Math.sin((Math.PI / 180) * (mprime - m + 2 * f));
        apt1 -= 0.00002 * Math.sin((Math.PI / 180) * (mprime - m - 2 * f));
        apt1 -= 0.00002 * Math.sin((Math.PI / 180) * (3 * mprime + m));
        apt1 += 0.00002 * Math.sin((Math.PI / 180) * (4 * mprime));
        
		var apt2 = 0.000325 * Math.sin((Math.PI / 180) * (299.77 + 0.107408 * k - 0.009173 * t2));

        apt2 += 0.000164 * Math.sin((Math.PI / 180) * (251.83 + 26.651886 * k));
        apt2 += 0.000126 * Math.sin((Math.PI / 180) * (349.42 + 36.412478 * k));
        apt2 += 0.00011 * Math.sin((Math.PI / 180) * (84.66 + 18.206239 * k));

        apt2 += 0.000056 * Math.sin((Math.PI / 180) * (154.84 + 7.30686 * k));
        apt2 += 0.000047 * Math.sin((Math.PI / 180) * (34.52 + 27.261239 * k));
        apt2 += 0.000042 * Math.sin((Math.PI / 180) * (207.19 + 0.121824 * k));
        apt2 += 0.00004 * Math.sin((Math.PI / 180) * (291.34 + 1.844379 * k));
        apt2 += 0.000037 * Math.sin((Math.PI / 180) * (161.72 + 24.198154 * k));
        apt2 += 0.000035 * Math.sin((Math.PI / 180) * (239.56 + 25.513099 * k));
        apt2 += 0.000023 * Math.sin((Math.PI / 180) * (331.55 + 3.592518 * k));
        
		jdt = pt + apt1 + apt2;

		jdt = jdt - this.DeltaT(yy, mm) / 1440; //修正dynamical time to Universal time
		jdt = jdt + 8 / 24; //因中國比格林威治先行8小時,加1/3天

			var jd = this.Jdays(yy, 1, 1, 0, 0, 0); //算<=当年的那个朔望日
			var k2 = this.MeanNewMoon(jd, true);

			if(this.smXFu[yy][n]){

			}
		}

		return jdt;
    };
    /**
     * 以比較日期法求算冬月及其餘各月名稱代碼,包含閏月,冬月為0,臘月為1,正月為2,餘類推.閏月多加0.5 [各月名稱, 含冬至連續16個新月點]
     * @param int yy(-1000-3000)

    this.GetZQandSMandLunarMonthCode = function(yy) {

			var jq = this.GetAdjustedJQ(yy + i, true);

		for(var i = 0; i < 15; ){

                //若陰曆臘月起始日大於冬至中氣日,且陰曆正月起始日小於或等於大寒中氣日,則此月為閏月,其餘同理
                if (Math.floor((sjd[i] + 0.5) > Math.floor(qjd[i - 1 - yz] + 0.5) && Math.floor(sjd[i + 1] + 0.5) <= Math.floor(qjd[i - yz] + 0.5))) {

            }
        } else { //否則表示兩個連續冬至之間只有11個整月,故無閏月
            for (var i = 1; i <= 12; i++) { //直接賦予這12個月月代碼
                mc[i] = i;
            }
            for (var i = 13; i <= 14; i++) { //處理次一置月年的11月與12月,亦有可能含閏月
                //若次一陰曆臘月起始日大於附近的冬至中氣日,且陰曆正月起始日小於或等於大寒中氣日,則此月為閏月,次一正月同理.
                if (Math.floor((sjd[i] + 0.5) > Math.floor(qjd[i - 1 - yz] + 0.5) && Math.floor(sjd[i + 1] + 0.5) <= Math.floor(qjd[i - yz] + 0.5))) {
                    mc[i] = i - 0.5;
                    yz = 1; //標示遇到閏月
                } else {
                    mc[i] = i - yz; //遇到閏月開始,每個月號要減1
                }
            }
        }
		
		this.MC[yy] = mc;
		this.SM[yy] = sjd;
		
        return [mc, sjd];
    };
    /**
     * 将农历时间转换成公历时间 [年,月,日,附加资料]
     * @param int yy(-1000-3000)
     * @param int mm(1-12)
     * @param int dd(1-30)
     * @param boolean ry 是否闰月
     * @return false/array
     */
    this.Lunar2Solar = function(yy, mm, dd, ry) { //此為將陰曆日期轉換為陽曆日期的主程式
        var yy = this.intval(yy);
        var mm = this.intval(mm);
        var dd = this.intval(dd);
        var ry = this.boolval(ry);

		if(mm < 1 || mm > 12){ //月份錯誤
			return false;
		}
		if(dd < 1 || dd > 30){ //日期錯誤
			return false;
		}
		var ob = { //返回附加资料
			'leap':0, //闰月,以1为正月开始
			'days':[] //每月多少天[5][1] = 30;表示该年闰五月30天
		};
		var [mc, sjd] = this.GetZQandSMandLunarMonthCode(yy);
        var runyue = 0; //若閏月旗標為0代表無閏月
        for (var j = 1; j <= 14; j++) { //確認指定年前一年11月開始各月是否閏月
            if (mc[j] - Math.floor(mc[j]) > 0) { //若是,則將此閏月代碼放入閏月旗標內
                runyue = Math.floor(mc[j] + 0.5); //runyue=0對應陰曆11月,1對應陰曆12月,2對應陰曆隔年1月,依此類推.
				if(runyue >= 3){
					ob.leap = runyue - 2;
				}
                break;
            }
        }
        var mx = mm + 2; //11月對應到1,12月對應到2,1月對應到3,2月對應到4,依此類推
		var nofd = []; //大概是number of day的意思
        for (var i = 0; i <= 14; i++) { //求算陰曆各月之大小,大月30天,小月29天,0为农历11月
            nofd[i] = Math.floor(sjd[i + 1] + 0.5) - Math.floor(sjd[i] + 0.5); //每月天數,加0.5是因JD以正午起算
			if(mc[i] < 2){
				continue;
			}
			var m = Math.floor(mc[i] - 1); //月份
			if(m > 12){
				continue;
			}
			var j = (m == (mc[i] - 1)) ? 0 : 1; //是否闰月
			if(ob.days[m] == undefined){
				ob.days[m] = [];
			}
			ob.days[m][j] = nofd[i];
        }
        var er = 0; //若輸入值有錯誤,er值將被設定為对应错误代码
        if (ry == true) { //若有勾選閏月
			if (runyue < 3) { //而旗標非閏月或非本年閏月,則表示此年不含閏月,runyue=0代表無閏月,=1代表閏月為前一年的11月,=2代表閏月為前一年的12月
				er = 7; //此年非閏年
			} else { //若本年內有閏月
				if (runyue != mx) { //但不為輸入的月份
					er = 8; //則此輸入的月份非閏月
				} else { //若輸入的月份即為閏月
					if (dd <= nofd[mx]) { //若輸入的日期不大於當月的天數
						var jdx = sjd[mx] + dd - 1; //則將當月之前的JD值加上日期之前的天數
					} else { //日期超出範圍
						er = 4;
					}
				}
			}
		} else { //若沒有勾選閏月則
			if (runyue == 0) { //若旗標非閏月,則表示此年不含閏月(包括前一年的11月起之月份)
				if (dd <= nofd[mx - 1]) { //若輸入的日期不大於當月的天數
					var jdx = sjd[mx - 1] + dd - 1; //則將當月之前的JD值加上日期之前的天數
				} else { //日期超出範圍
					er = 4;
				}
			} else { //若旗標為本年有閏月(包括前一年的11月起之月份)
				//公式nofd(mx - (mx > runyue) - 1)的用意為:若指定月大於閏月,則索引用mx,否則索引用mx-1
				if (dd <= nofd[mx + (mx > runyue) - 1]) { //若輸入的日期不大於當月的天數
					var jdx = sjd[mx + (mx > runyue) - 1] + dd - 1; //則將當月之前的JD值加上日期之前的天數
				} else { //日期超出範圍
					er = 4;
				}
			}
		}
		if(er > 0){
			return false;
		}
		var [yi, mi, dz] = this.Jtime(jdx);
		
        return [yi, mi, dz, ob];
    };
    /**
     * 将公历时间转换成农历时间(古代历法来自寿星万年历) [年,月,日,是否闰月,附加资料]
     * @param int yy(-1000-3000)
     * @param int mm(1-12)
     * @param int dd(1-31)
     * @return false/array
     */
    this.Solar2Lunar = function(yy, mm, dd) {
        var yy = this.intval(yy);
        var mm = this.intval(mm);
        var dd = this.intval(dd);

        //驗證輸入日期的正確性,若不正確則跳離
        if (this.ValidDate(yy, mm, dd) === false) {
            return false;
        }
		var ob = { //返回附加资料,古代农历要用到
			'ym':'', //月建别名yue ming
			'yi':0, //正月初一定年份,所以改了月建要相应改年份,不具备唯一性仅供展示,要逆转到公历必须用返回中的[yi, mi, dz, ry]
			'gz':'', //干支纪年(以正月初一为界)
			'days':0 //该农历月份有多少天
		};
		var jdx = this.Jdays(yy, mm, dd, 12, 0, 0); //求出指定年月日之JD值
		
		//-721年至-104年的后九月及月建问题,与朔有关,与气无关.不同历法交汇,导致某些农历日期会对应到多个公历,所以这段时期不支持逆转到公历.如 -221-9-1 与 -221-10-31 的农历都是-221年十月初一
		if (jdx >= 1457698 && jdx <= 1683430) { //这一段来自寿星万年历,十九年七闰法:7个闰年均匀安插在19个年整数中,闰年的末月置为闰月
			var yi = 0; //定农历年份
			var mi = 0; //农历月份从1开始
			var dz = 0; //农历日期从1开始
			var ry = false; //是否闰月,只有闰九和闰十二
			var ii = 0; //该公历日期在第几轮循环中
			var ns = []; //年首相关信息,NianShou
			for (var i = 0,step = 3; i <= step; i++) { //计算连续的正月初一,对应的农历日期必定在此范围内
				var jd = 0;
				var YY = yy + i - 1; //可能所在的农历年份
				if (YY >= -220) { //秦汉历,19年7闰,年首为十月,mi=4为正月,闰年的末月置闰并取名"后九"月,1640641为历法生效时间公历-221.10.31
					jd = 1640641 + Math.floor(0.866 + (YY + 220) * 12.369000) * this.synmonth; //颁行历年首
					ns[i + 6] = '后九'; //闰月名称
					ns[i + 11] = 10; //表示第10个月置闰
				}else if (YY >= -479) { //战国历,19年7闰,年首为正月,闰年的末月置闰并取名闰"十三",1546083为历法生效时间公历-480.12.11
					jd = 1546083 + Math.floor(0.500 + (YY + 479) * 12.368422) * this.synmonth;
					ns[i + 6] = '十三';
					ns[i + 11] = 13; //表示第13个月置闰
				}else if (YY >= -722) { //春秋历,19年7闰,年首为正月,闰年的末月置闰并取名闰"十三",1457698为历法生效时间公历-722.12.17
					jd = 1457698 + Math.floor(0.342 + (YY + 721) * 12.368422) * this.synmonth;
					ns[i + 6] = '十三';
					ns[i + 11] = 13;
				}
				if(jd < 1457698){
					continue;
				}
				ns[i] = this.TrueNewMoon(jd, true);
				ns[i] = Math.floor(ns[i] + 0.5); //确保统一成整数
				if(jdx > ns[i]){
					continue;
				}
				
				ii = (jdx == ns[i]) ? i : (i - 1); //正好年初一那天
				yi = (jdx == ns[i]) ? YY : (YY - 1);
				step = ii + 1; //多算一个年初一以确定本年有多少个月
			}
			var tjd = [];
			for(var j = 0; j < 14; j++){ //逐步算出朔望日,得到闰月日期等
				var jd = (j == 0) ? ns[ii] : this.TrueNewMoon(tjd[j - 1] + this.synmonth + 14, true); //以jd值代入求瞬時朔望日
				jd = Math.floor(jd + 0.5); //确保统一成整数
				if(mi + dz == 0){ //还没找到过
					if(jdx == jd){ //正好是这个月初一
						mi = j + 1;
						dz = 1;
					}
					if(jdx < jd){ //在上一个月
						mi = j; //减一再加一
						dz = jdx - tjd[j - 1] + 1;
					}
				}
				tjd[j] = jd; //最后一个是下一年年初一的,用于计算每个月多少天
				if(jd >= ns[ii + 1]){ //下一年的年初一
					break;
				}
			}
			ob.yi = yi;
			ob.ym = this.dxy[(mi + ns[ii + 11] - 2)%12];
			ob.days = tjd[mi] - tjd[mi-1]; //该月多少天

			if(mi <= 12 - ns[ii + 11] + 1){ //正月之前算上一年
				ob.yi--;
			}
			if(tjd.length == 14){ //该年有闰月
				if(mi == 13){ //都是最后一个月置闰
					ry = true;
					ob.ym = ns[ii + 6]; //非常规,可能史书上称后九或十三
				}
			}
			
			ob.gz = this.gz[((ob.yi + 4712 + 24) % 60 + 60) % 60]; //干支纪年
			
			return [yi, mi, dz, ry, ob];
		}
		for(var ty = yy, flag = 0; ; ty--,flag = 1){
			var [mc, sjd] = this.GetZQandSMandLunarMonthCode(ty);
			if (Math.floor(jdx) >= Math.floor(sjd[0] + 0.5)) {
				break;
			}
		}
        for (var i = 0; i <= 14; i++) { //下面的指令中加0.5是為了改為從0時算起而不從正午算起
            if (Math.floor(jdx) >= Math.floor(sjd[i] + 0.5) && Math.floor(jdx) < Math.floor(sjd[i + 1] + 0.5)) {
                var mi = i;
                break;
            }
        }
        var dz = Math.floor(jdx) - Math.floor(sjd[mi] + 0.5) + 1; //此處加1是因為每月初一從1開始而非從0開始
		var dn = Math.floor(sjd[mi + 1] + 0.5) - Math.floor(sjd[mi] + 0.5); //该月多少天
		
        if (mc[mi] < 2 || flag == 1) {
            var yi = yy - 1;
        } else {
            var yi = yy;
        } //因mc(mi)=0對應到前一年陰曆11月,mc(mi)=1對應到前一年陰曆12月
        //mc(mi)=2對應到本年1月,依此類推
        if ((mc[mi] - Math.floor(mc[mi])) * 2 + 1 == 1) {
            var ry = false;
        } else {
            var ry = true;
        }
        var mi = (Math.floor(mc[mi] + 10) % 12) + 1; //對應到月份

		ob.yi = yi;
		ob.days = dn;
		ob.ym = this.dxy[mi - 1]; //月建对应的默认月名称:建子十一,建丑十二,建寅为正...
		
		var Dm = jdx - dz + 1; //这个月的初一儒略日
		if (Dm >= 1724360 && Dm <= 1729794) { //8.01.15至 23.12.02 建子为十二,其它顺推.这个1724360是9.01.15,不知道是不是寿星笔误
			ob.ym = this.dxy[mi%12];
			if(mi == 12){ //腊月变成了下一年
				ob.yi++;
			}
		} else if (Dm >= 1807724 && Dm <= 1808699) { //237.04.12至239.12.13 建子为十二,其它顺推
			ob.ym = this.dxy[mi%12];
			if(mi == 12){ //腊月变成了下一年
				ob.yi++;
			}
		} else if (Dm >= 1999349 && Dm <= 1999467) { //761.12.02至762.03.30 建子为正月,其它顺推
			ob.ym = this.dxy[(mi + 1)%12];
			if(mi == 11 || mi == 12){ //正月腊月算到下一年
				ob.yi++;
			}
		} else if (Dm >= 1973067 && Dm <= 1977052) { //689.12.18至700.11.15 建子为正月,建寅为一月,其它不变.一整年变为: 正月,腊月,一月,二月,三月...
			if (mi == 11) {
				ob.ym = "正";
			}
			if (mi == 1) {
				ob.ym = '一';
			}
			if(mi == 11 || mi == 12){ //正月腊月算到下一年
				ob.yi++;
			}
		} 
		if (Dm == 1729794 || Dm == 1808699) {
			ob.ym = '拾贰'; //239.12.13及23.12.02均为十二月,为避免两个连续十二月，此处改名
		}
		
		ob.gz = this.gz[((ob.yi + 4712 + 24) % 60 + 60) % 60]; //干支纪年
		
        return [yi, mi, dz, ry, ob];
    };
    /**
     * 计算公历的某天是星期几(PHP中的date方法,此处演示儒略日历的转换作用) this.wkd[i]
     * @param int yy(-1000-3000)
     * @param int mm(1-12)
     * @param int dd(1-31)
     * @return false/int
     */
    this.GetWeek = function(yy, mm, dd) {
        var yy = this.intval(yy);
        var mm = this.intval(mm);
        var dd = this.intval(dd);

        var spcjd = this.Jdays(yy, mm, dd, 12, 0, 0);
        if (spcjd === false) {
            return false;
        }

        return (((Math.floor(spcjd + 1) % 7)) + 7) % 7; //模數(或餘數)為0代表星期日(因为西元前4713年1月1日12時为星期一).spcjd加1是因起始日為星期一
    };
    /**
     * 获取公历某个月有多少天
     * @param int yy(-1000-3000)
     * @param int mm(1-12)
     * @return number
     */
    this.GetSolarDays = function(yy, mm) {
        var yy = this.intval(yy);
        var mm = this.intval(mm);

        if (mm < 1 || mm > 12) { //月份超出範圍
            return 0;
        }
        if (yy == 1582 && mm == 10) { //这年这个月的5到14日不存在,所以1582年10月只有21天
            return 21;
        }
        var ndf1 = -(yy % 4 == 0); //可被四整除
        var ndf2 = ((yy % 400 == 0) - (yy % 100 == 0)) && (yy > 1582);
        var ndf = ndf1 + ndf2;
        return 30 + ((Math.abs(mm - 7.5) + 0.5) % 2) - (mm == 2) * (2 + ndf);
    };
	/**
     * 获取农历某个月有多少天
     * @param int yy(-1000-3000)
     * @param int mm(1-12)
     * @param bool ry 是否闰月
     * @return number
     */
    this.GetLunarDays = function(yy, mm, ry){
        yy = this.intval(yy);
        mm = this.intval(mm);
        ry = this.boolval(ry);
        
        var a = this.Lunar2Solar(yy, mm, 1, ry);
		if(a == false){ //比如年份超出范围或该月不是闰月
            return 0;
        }
        var ob = a[3];
        var days = ob['days'];
        return days[mm][ry?1:0];
    };
    /**
     * 获取农历某年的闰月,0为无闰月
     * @param int yy(-1000-3000)
     * @return number
     */
    this.GetLeap = function (yy){
        yy = this.intval(yy);
        
        var a = this.Lunar2Solar(yy, 1, 1, false);
		if(a == false){
            return 0;
        }
        var ob = a[3];
        return ob['leap'];
    };
    /**
     * 四柱計算,根据this.zwz决定是否分早子时晚子时,传公历
     * @param int yy(-1000-3000)
     * @param int mm(1-12)
     * @param int dd(1-31)
     * @param int hh(0-23)
     * @param int mt(0-59),分钟,在跨节的时辰上会需要,有的排盘忽略跨节
     * @param int ss(0-59),秒数
     * @return false/array(天干, 地支, 附加资料)
     */
    this.GetGZ = function(yy, mm, dd, hh, mt, ss) {
        var yy = this.floatval(yy);
        var mm = this.floatval(mm);
        var dd = this.floatval(dd);
        var hh = this.floatval(hh);
        var mt = (mt === undefined) ? 0 : this.floatval(mt);
        var ss = (ss === undefined) ? 0 : this.floatval(ss);

        if (mt + ss == 0) { //避免整点模糊
            ss = 10;
        }

        if (this.ValidDate(yy, mm, dd) === false) {
            return false;
        }

        var spcjd = this.Jdays(yy, mm, dd, hh, mt, ss);
        if (spcjd === false) {
            return false;
        }
		
		var jr = [];
		for(var ty = yy; ; ty--){ //公历年的立春在前一年春分开始的数组中
			var dj = this.GetAdjustedJQ(ty, false);
			jr = dj.concat(jr); //往前插入
			if(spcjd >= dj[21]){ //dj[21]為立春,約在2月5日前後,若小於dj[21],則屬於前一個節氣年
				ty++;
				break;
			}
		}

        var tg = [];
        var dz = [];
        var ygz = ((ty + 4712 + 24) % 60 + 60) % 60;
        tg[0] = ygz % 10; //年干
        dz[0] = ygz % 12; //年支
        for (var j = 0; ; j++) {
            if (spcjd < jr[21 + 2*j]) {
                var tm = j - 1;
                break;
            } //已超過指定時刻,故應取前一個節氣
        }

        var tmm = ((ty + 4712) * 12 + tm + 60) % 60;
        var mgz = (tmm + 50) % 60;
        tg[1] = mgz % 10; //月干
        dz[1] = mgz % 12; //月支
        //計算日柱之干支 
        var jda = spcjd + 0.5; //加0.5是將起始點從正午改為從0點開始
        var thes = ((jda - Math.floor(jda)) * 86400) + 3600; //將jd的小數部份化為秒,並加上起始點前移的一小時(3600秒),取其整數值
        var dayjd = Math.floor(jda) + thes / 86400; //將秒數化為日數,加回到jd的整數部份
        var dgz = (Math.floor(dayjd + 49) % 60 + 60) % 60;
        tg[2] = dgz % 10; //日干
        dz[2] = dgz % 12; //日支
        if (this.zwz && (hh >= 23)) { //区分早晚子时,日柱前移一柱
            tg[2] = (tg[2] + 10 - 1) % 10;
            dz[2] = (dz[2] + 12 - 1) % 12;
        }
        //計算時柱之干支
        var dh = dayjd * 12;
        var hgz = (Math.floor(dh + 48) % 60 + 60) % 60;
        tg[3] = hgz % 10; //時干
        dz[3] = hgz % 12; //時支
		
		var ob = {
			ty: ty,
			jr: jr
		};
        return [tg, dz, ob];
    };
    /**
     * 根据年干支计算所有合法的月干支
     * @param int ygz(0-59) 年柱干支代码
     * @return array 月柱干支代码列表
     */
    this.MGZ = function(ygz) {
		var ygz = this.intval(ygz);
		
        var mgz = [];

        //var ygz = this.gz.indexOf(ygz);

        var nv = 2 + 12 * (ygz % 10);
        for (var i = 0; i <= 11; i++) {
            var pv = (i + nv) % 60;
            mgz[pv] = this.gz[pv];
        }
        return mgz;
    };
    /**
     * 根据日干支计算所有合法的时干支
     * @param int dgz(0-59) 日柱干支代码
     * @return array 时柱干支代码列表
     */

                return { id: cid, pid: c[0], name: c[1], j: c[2], w: c[3], via: c[1], topName: item.name, topId: item.id };
            }

        }

    }

    /**
     * 城市名/拼音模糊查找,返回全部匹配(按相关度排序)
     * @param string name 城市名(中文,可带可不带省市县后缀)或拼音(全拼/首字母,无声调)
     * @param int limit 最多返回条数

    function findCityAll(name, limit) {

                continue;
            }
            var one = {
                id: it.id,
                name: it.name,
                j: rc.j,
                w: rc.w,
                path: pathOf(it),
                score: Math.round(hits[h].score)

        }
        return out;
    }

    /**
     * 城市名/拼音模糊查找,返回最佳一个
     * @param string name
     * @return null|{name, j(经度), w(纬度), id, path}
     */
    function findCity(name) {
        var all = findCityAll(name, 1);

    }

    /**
     * 某行政区(省/市/区)的直接下辖列表,用于"市->区"级联选择
     * @param int id 上级条目 id(JW 数组下标)
     * @param int limit 最多返回条数
     * @return array [{id, name, j, w, path, via?}]
     */
    function childrenOf(id, limit) {
        buildIndex();
        limit = limit || 20;
        var kids = CHILDREN[id] || [];
        var out = [];
        for (var i = 0; i < kids.length && out.length < limit; i++) {
            var it = IDX[kids[i] - 1]; // JW 数组下标即 id,IDX 按 id-1 存储
            if (!it || it.id !== kids[i]) {
                continue;
            }
            var rc = resolveCoord(it);
            if (!rc) { // 整棵子树都没有坐标
                continue;
            }
            var one = { id: it.id, name: it.name, j: rc.j, w: rc.w, path: pathOf(it) };
            if (rc.id !== it.id) { // 坐标来自更下级
                one.via = rc.name;
            }
            out.push(one);
        }
        return out;
    }

    /**
     * 省级单位列表(pid===0 的顶层条目),坐标取第一个带坐标的下级
     * @param int limit 最多返回条数
     * @return array [{id, name, j, w, path, via?}]
     */
    function provinces(limit) {
        buildIndex();
        limit = limit || 40;
        var kids = CHILDREN[0] || [];
        var out = [];
        for (var i = 0; i < kids.length && out.length < limit; i++) {
            var it = IDX[kids[i] - 1];
            if (!it) {
                continue;
            }
            var rc = resolveCoord(it);
            if (!rc) {
                continue;
            }
            var one = { id: it.id, name: it.name, j: rc.j, w: rc.w, path: pathOf(it) };
            if (rc.id !== it.id) { // 坐标来自下级
                one.via = rc.name;
            }
            out.push(one);
        }
        return out;
    }

    return {
        JW: JW,
        roundLat: roundLat,
        findCity: findCity,
        findCityAll: findCityAll,
        childrenOf: childrenOf,
        provinces: provinces
    };
}));

</script>
<script>/* ==== src/engine/localjq.js ==== */
/**
 * 纬度调月令引擎(本软件核心,排盘黄金标准 §月令调整,设计文档 §3.1)
 *
 * 规则(逐条来自黄金标准原文):
 *   - 基准北纬35°,34~36之间不调整;
 *   - 纬度差 = |纬度 - 35|; 天数差 = 纬度差 × 2(每纬度2天,0.5°论1天);
 *   - 北方(>35°): 春夏节令向后延,秋冬节令向前提; 南方(<35°): 春夏向前提,秋冬向后延;

 *   - 全部节令以农历日期表达,底层用 calendar.js 天文节气锚定公历日期再转农历。
 *
 * 用法:
 *   Node:   var LocalJQ = require("./engine/localjq.js"); var lq = new LocalJQ(cal);
 *   浏览器: <script src="src/engine/calendar.js"><\/script><script src="src/engine/localjq.js"><\/script>
 *   lq.getYearJieqi(2000, 45) => 哈尔滨2000年本地实际节令表

        { name: '立春', dy: -1, idx: 21, season: 0, zhi: 2 },
        { name: '惊蛰', dy: -1, idx: 23, season: 0, zhi: 3 },
        { name: '清明', dy: 0, idx: 1, season: 0, zhi: 4 },
        { name: '立夏', dy: 0, idx: 3, season: 0, zhi: 5 },
        { name: '芒种', dy: 0, idx: 5, season: 0, zhi: 6 },
        { name: '小暑', dy: 0, idx: 7, season: 0, zhi: 7 },
        { name: '立秋', dy: 0, idx: 9, season: 1, zhi: 8 },
        { name: '白露', dy: 0, idx: 11, season: 1, zhi: 9 },
        { name: '寒露', dy: 0, idx: 13, season: 1, zhi: 10 },
        { name: '立冬', dy: 0, idx: 15, season: 1, zhi: 11 },
        { name: '大雪', dy: 0, idx: 17, season: 1, zhi: 0 },
        { name: '小寒', dy: 0, idx: 19, season: 1, zhi: 1 },

            var jdT = (def.dy === -1) ? jqPrevT[def.idx] : jqCurT[def.idx];
            var t = cal.Jtime(jd);   // 历法节令公历日期
            var tt = cal.Jtime(jdT); // 历法交节时刻(展示)
            var lu = cal.Solar2Lunar(t[0], t[1], t[2]); // 历法节令农历日期

            // 平移: 北方春夏向后延(+)/秋冬向前提(-),南方相反; 交节日当天不计入,故直接±N天
            var shift = 0;
            if (days > 0) {

            var jdLocal = jd0 + shift;

            var llu = cal.Solar2Lunar(lt[0], lt[1], lt[2]); // 本地节令农历日期

            list.push({
                name: def.name,
                season: def.season === 0 ? '春夏' : '秋冬',
                zhi: def.zhi,
                zhiName: cal.cdz[def.zhi],
                liSolar: [t[0], t[1], t[2]],
                liTime: pad2(tt[3]) + ':' + pad2(tt[4]),
                liLunar: lunarObj(cal, lu),
                shift: shift,
                shiftText: shift === 0 ? '不调整' : (shift > 0 ? '向后延' + days + '天' : '向前提' + days + '天'),
                solar: [lt[0], lt[1], lt[2]],

                coveredBy: null

                top.covered = true;
                top.coveredBy = cur.name;

            valid.push(cur);

            year: year,
            lat: lat,
            latDiff: info.latDiff,
            days: days,

    }

    LocalJQ.BASE_LAT = BASE_LAT;
    return LocalJQ;

<script>/* ==== src/engine/pillars.js ==== */
/**
 * 四柱定盘(设计文档 §3.2)
 *
 * 与市面排盘工具的差异(排盘黄金标准方法论):
 *   - 年柱以"本地实际立春"为界(经纬度调月令平移后的立春农历日期),而非全国统一立春时刻;

                + '<br><span class="muted">仅用于日、时柱；年月及大运按钟表时间节令。</span>'
                + '</td></tr>');
        }
        L.push('</tbody></table>');
        return L.join('');
    }

    function buildPillars(r) {
        var rl = r.relations;
        var ps = rl.pillars;
        var head = '<tr><th></th>' + ps.map(function (p) { return '<th>' + p.pos + '柱</th>'; }).join('') + '</tr>';
        function row(name, fn, cls) {
            return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><th>' + name + '</th>' + ps.map(function (p, i) { return fn(p, i); }).join('') + '</tr>';
        }
        var L = ['<table>', head];
        L.push(row('干支', function (p) { return '<td class="gz">' + p.gz + '</td>'; }));
        L.push(row('天干十神', function (p) {
            return '<td>' + p.tg.name + ' ' + esc(p.tg.ss) + ' <span class="muted">' + p.tg.wx + p.tg.yy + '</span></td>';
        }));
        L.push(row('地支十神', function (p) {
            return '<td>' + p.dz.name + ' ' + esc(p.dz.ss) + ' <span class="muted">' + p.dz.wx + p.dz.yy + '</span></td>';
        }));
        L.push(row('藏干(十神)', function (p) {
            return '<td>' + p.dz.canggan.map(function (c) { return c.name + '<span class="muted">' + c.ss + '</span>'; }).join(' ') + '</td>';
        }));
        L.push(row('长生', function (p) { return '<td>' + esc(p.dz.zhangsheng) + '</td>'; }));
        L.push(row('纳音', function (p) { return '<td>' + esc(p.nayin) + '</td>'; }));
        L.push(row('空亡', function (p) { return '<td>' + (p.kong ? '<span class="tag cover">空亡</span>' : '-') + '</td>'; }));
        L.push('</table>');
        // 每柱推算过程
        var P = r.pillars;
        L.push('<p class="via">年柱:' + esc(P.year.via) + '<br>月柱:' + esc(P.month.via)
            + '<br>日柱:' + esc(P.day.via) + '<br>时柱:' + esc(P.hour.via) + '</p>');
        return L.join('');
    }

    // 本地实际节令表(特色): 历法节令 -> 平移 -> 本地节令 -> 覆盖标记
    function buildJieqi(r) {
        if (r.technique && !r.technique.blindPaipanTechnique) {
            return '<p>盲派排盘技法未启用：本次按全国统一节气口径排盘，不使用纬度调整月令。</p>';
        }
        var jq = r.jieqi;
        var L = [];
        L.push('<p>基准北纬35°;本地纬度 ' + jq.lat + '°,纬度差 ' + jq.latDiff + '°,天数差 ' + jq.days + ' 天;' + esc(jq.direction)
            + ';交节日当天不计入,平移从交节次/前一日起数。</p>');
        L.push('<table><tr><th>节</th><th>时段</th><th>历法公历</th><th>交节时刻</th><th>历法农历</th><th>平移</th><th>本地公历</th><th>本地农历</th><th>状态</th></tr>');
        jq.list.forEach(function (e) {
            var cls = e.covered ? ' class="covered"' : (e.name === '次年立春' ? ' class="boundary"' : '');
            var status = e.covered ? '<span class="tag cover">被' + esc(e.coveredBy) + '覆盖</span>'
                : (e.name === '次年立春' ? '<span class="muted">年末边界</span>' : '<span class="tag ok">' + e.zhiName + '月起</span>');
            L.push('<tr' + cls + '><td>' + e.name + '</td><td>' + e.season + '</td>'
                + '<td>' + ymd(e.liSolar) + '</td><td>' + e.liTime + '</td><td>' + esc(e.liLunar.text) + '</td>'
                + '<td>' + esc(e.shiftText) + '</td>'
                + '<td>' + ymd(e.solar) + '</td><td>' + esc(e.lunar.text) + '</td><td>' + status + '</td></tr>');
        });
        L.push('</table>');
        var skipped = jq.list.filter(function (e) { return e.covered; });
        if (skipped.length) {
            L.push('<p class="via">覆盖说明:' + skipped.map(function (e) {
                return esc(e.name) + '被' + esc(e.coveredBy) + '覆盖,' + e.zhiName + '月跳过';
            }).join(';') + '。</p>');
        }
        return L.join('');
    }

    function buildPalaces(r) {
        var p = r.palaces;
        function card(name, o) {
            return '<div class="card"><div>' + name + '</div><div class="gz">' + o.gz + '</div><div class="via">' + esc(o.via) + '</div></div>';
        }
        return '<div class="cards">' + card('胎元', p.taiyuan) + card('命宫', p.minggong) + card('身宫', p.shengong) + '</div>';
    }

    function buildDayun(r) {
        var d = r.dayun;
        var L = [];
        L.push('<p>' + esc(d.dirText) + '(' + esc(r.pillars.year.gz[0]) + '年' + (r.input.gender || '') + '),'
            + (d.shun ? '顺数到下一个本地节' : '逆数到上一个本地节') + '。</p>');
        L.push('<table><tbody>');
        L.push('<tr><th>出生日</th><td>' + ymd(d.birth.solar) + '(' + esc(d.birth.lunar) + ')</td><td class="via">' + esc(d.birth.via) + '</td></tr>');
        L.push('<tr><th>交节日</th><td>' + esc(d.target.name) + ' ' + ymd(d.target.solar) + '(' + esc(d.target.lunar) + ')</td><td class="via">' + esc(d.target.via) + '</td></tr>');
        L.push('<tr><th>数天数</th><td colspan="2">起止两日都计入,共 ' + d.rawDays + ' 天;取舍后 ' + d.totalDays + ' 天</td></tr>');
        L.push('<tr><th>折算</th><td colspan="2">' + d.totalDays + ' ÷ 3 = ' + d.div3.quotient + ' 岁'
            + (d.div3.remainder ? ',余' + d.div3.remainder + ' 折 ' + d.div3.remMonths + ' 个月' : ',无余')
            + ';再加出生月(' + d.birthOrder + ' 月)' + (d.monthCarry ? ',月数超12进1岁' : '')
            + ' ⇒ <b>' + esc(d.start.text) + '</b></td></tr>');
        L.push('</tbody></table>');
        L.push('<table><tr><th>大运</th>' + d.yun.map(function (y) { return '<th class="gz">' + y.gz + '</th>'; }).join('') + '</tr>'
            + '<tr><th>起运</th>' + d.yun.map(function (y) { return '<td>' + y.sui + '岁' + y.months + '个月</td>'; }).join('') + '</tr></table>');
        return L.join('');
    }

    function buildGX(r) {
        var gx = r.relations.gx;
        if (!gx.length) {
            return '<p class="muted">无刑冲合害关系。</p>';
        }
        return '<table><tr><th>类别</th><th>关系</th><th>柱位</th></tr>'
            + gx.map(function (g) {
                return '<tr><td>' + g.target + '</td><td>' + esc(g.text) + '</td><td>' + g.positions.join('、') + '</td></tr>';
            }).join('') + '</table>';
    }

    function buildStat(r) {
        var wx = r.relations.wuxing;
        var total = wx.count.reduce(function (a, b) { return a + b; }, 0) || 1;
        var bar = '<div class="wxbar">' + wx.names.map(function (n, i) {
            var pct = wx.count[i] / total * 100;
            return pct ? '<div style="width:' + pct + '%;background:' + WX_COLOR[n] + '">' + n + wx.count[i] + '</div>' : '';
        }).join('') + '</div>';
        var yy = r.relations.yinyang;
        return bar
            + '<p>五行(不含藏干):' + wx.names.map(function (n, i) { return n + ' ' + wx.count[i]; }).join('、') + '</p>'
            + '<p>阴阳(不含藏干):' + yy.names.map(function (n, i) { return n + ' ' + yy.count[i]; }).join('、') + '</p>';
    }

    // 神煞: 四柱四列,每柱列出命中的神煞(吉绿/凶红/中性灰,title 附释义)
    function buildShensha(r) {
        var s = r.shensha;
        if (!s || !s.total) {
            return '<p class="muted">四柱未命中神煞。</p>';
        }
        var luckCls = { '吉': 'tag ok', '凶': 'tag cover', '中性': 'tag plain' };
        var h = '<table><tr><th></th>' + s.pillars.map(function (p) { return '<th>' + p.pos + '柱 ' + esc(p.gz) + '</th>'; }).join('') + '</tr>';
        h += '<tr><th>神煞</th>' + s.pillars.map(function (p) {
            if (!p.list.length) {
                return '<td class="muted">—</td>';
            }
            return '<td>' + p.list.map(function (x) {
                return '<span class="' + luckCls[x.luck] + '" title="' + esc(x.desc) + '">' + esc(x.name) + '</span>'
                    + '<br><span class="muted" style="font-size:11px">' + esc(x.basis) + '</span>';
            }).join('<br>') + '</td>';
        }).join('') + '</tr></table>';
        h += '<p class="muted">查法:驿马/桃花/华盖/将星/劫煞/灾煞/亡神以年支+日支查;天乙贵人/太极贵人/文昌/学堂/禄神/羊刃/金舆/红艳以日干查;'
            + '孤辰/寡宿/天喜/红鸾以年支查;天德/月德以月支查(命中四柱干支任一即算)。悬停神煞名看释义。</p>';
        return h;
    }

    function buildAll(r) {
        return {
            secBasic: buildBasic(r),
            secPillars: buildPillars(r),
            secJieqi: buildJieqi(r),
            secPalaces: buildPalaces(r),
            secDayun: buildDayun(r),
            secGX: buildGX(r),
            secShensha: buildShensha(r),
            secStat: buildStat(r)
        };
    }

    /* ============ DOM 绑定(仅浏览器) ============ */

    function bind(doc) {
        if (!doc) {
            return;
        }
        var $ = function (id) { return doc.getElementById(id); };

        // 公历/农历切换
        $('mode').addEventListener('change', function () {
            $('leapWrap').style.display = ($('mode').value === 'lunar') ? '' : 'none';
        });

        // 出生地: 国家->省->市->区 级联下拉(业界惯例),或"其他"手动经纬度
        var provSel = $('prov'), citySel = $('cityS'), distSel = $('dist'),
            cityInfo = $('cityInfo'), countrySel = $('country'),
            manualWrap = $('manualWrap'), lonIn = $('lonIn'), latIn = $('latIn');
        var provMap = {}, cityMap = {}, distMap = {}, pickedSearch = null;

        // 搜索框(中文/拼音模糊匹配,手机上不能输文字的 select 的补充): 点选结果自动回填级联下拉
        var searchInput = $('citySearch'), searchList = $('searchList');
        function selectByPath(p) {
            var pid = null, cid = null, did = null;
            for (var k in provMap) { if (provMap[k].name === p[0]) { pid = k; break; } }
            if (pid) {
                provSel.value = pid;
                loadCities(parseInt(pid, 10));
            }
            if (pid && p[1]) {
                for (var k2 in cityMap) { if (cityMap[k2].name === p[1]) { cid = k2; break; } }
                if (cid) {
                    citySel.value = cid;
                    loadDists(parseInt(cid, 10));
                }
            }
            if (cid && p[2]) {
                for (var k3 in distMap) { if (distMap[k3].name === p[2]) { did = k3; break; } }
                if (did) { distSel.value = did; }
            }
            showSelInfo();
        }
        function showSearch() {
            var q = searchInput.value.trim();
            pickedSearch = null;
            if (!q) { searchList.style.display = 'none'; return; }
            var list = Geo.findCityAll(q, 8);
            if (!list.length) { searchList.style.display = 'none'; return; }
            searchList.innerHTML = list.map(function (c, i) {
                return '<div data-i="' + i + '">' + esc(c.path.join(' / '))
                    + '<span class="sub">东经' + c.j + '° 北纬' + c.w + '° → 取舍' + Geo.roundLat(c.w) + '°</span></div>';
            }).join('');
            searchList.style.display = '';
            Array.prototype.forEach.call(searchList.children, function (el) {
                el.addEventListener('mousedown', function () {
                    var c = list[parseInt(el.getAttribute('data-i'), 10)];
                    pickedSearch = c;
                    searchInput.value = c.path.join('/');
                    searchList.style.display = 'none';
                    selectByPath(c.path); // 回填省/市/区下拉,与级联选择互通
                });
            });
        }
        searchInput.addEventListener('input', showSearch);
        searchInput.addEventListener('focus', showSearch);
        searchInput.addEventListener('blur', function () {
            setTimeout(function () { searchList.style.display = 'none'; }, 150);
        });
        function fill(selEl, list, ph) {
            selEl.innerHTML = '<option value="">' + ph + '</option>'
                + list.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + '</option>'; }).join('');
        }
        function loadProvs() {
            var ps = Geo.provinces(40);
            provMap = {};
            ps.forEach(function (p) { provMap[p.id] = p; });
            fill(provSel, ps, '— 请选择省 —');
        }
        function loadCities(pid) {
            var cs = Geo.childrenOf(pid, 400);
            cityMap = {};
            cs.forEach(function (c) { cityMap[c.id] = c; });
            fill(citySel, cs, '— 请选择市 —');
        }
        function loadDists(cid) {
            var ds = Geo.childrenOf(cid, 400);
            distMap = {};
            ds.forEach(function (d) { distMap[d.id] = d; });
            fill(distSel, ds, '— 请选择区/县 —');
        }
        function showSelInfo() {
            var c = null;
            if (distSel.value) { c = distMap[parseInt(distSel.value, 10)]; }
            else if (citySel.value) { c = cityMap[parseInt(citySel.value, 10)]; }
            else if (provSel.value) { c = provMap[parseInt(provSel.value, 10)]; }
            if (c) {
                var via = c.via ? ' (坐标取' + c.via + ')' : '';
                cityInfo.textContent = c.path.join(' / ') + ' 东经' + c.j + '° 北纬' + c.w + '°' + via
                    + ' → 取舍' + Geo.roundLat(c.w) + '°';
            } else {
                cityInfo.textContent = '';
            }
        }
        loadProvs();
        provSel.addEventListener('change', function () {
            pickedSearch = null; // 手动改级联,搜索选中作废
            citySel.innerHTML = '<option value="">— 请选择市 —</option>';
            distSel.innerHTML = '<option value="">— 请选择区/县 —</option>';
            cityMap = {}; distMap = {};
            if (provSel.value) { loadCities(parseInt(provSel.value, 10)); }
            showSelInfo();
        });
        citySel.addEventListener('change', function () {
            pickedSearch = null;
            distSel.innerHTML = '<option value="">— 请选择区/县 —</option>';
            distMap = {};
            if (citySel.value) { loadDists(parseInt(citySel.value, 10)); }
            showSelInfo();
        });
        distSel.addEventListener('change', function () { pickedSearch = null; showSelInfo(); });
        countrySel.addEventListener('change', function () {
            var manual = countrySel.value === 'manual';
            manualWrap.style.display = manual ? '' : 'none';
            provSel.style.display = citySel.style.display = distSel.style.display = manual ? 'none' : '';
            searchInput.style.display = manual ? 'none' : '';
            if (!manual) { showSelInfo(); }
        });

        // 排盘
        $('submit').addEventListener('click', function () {
            var err = $('error');
            err.textContent = '';
            var opt = {
                year: parseInt($('yy').value, 10),
                month: parseInt($('mm').value, 10),
                day: parseInt($('dd').value, 10),
                hour: parseInt($('hh').value, 10),
                minute: parseInt($('mi').value, 10) || 0,
                gender: doc.querySelector('input[name=gender]:checked').value,
                zwz: $('zwz').checked,
                zty: $('zty').checked,
                blindPaipanTechnique: $('blindPaipanTechnique').checked
            };
            if ($('mode').value === 'lunar') { // 农历先转公历
                var s = cal.Lunar2Solar(opt.year, opt.month, opt.day, $('leap').checked);
                if (s === false) {
                    err.textContent = '农历日期无效(可能该年无此闰月或日期超出范围)';
                    return;
                }
                opt.year = s[0]; opt.month = s[1]; opt.day = s[2];
            }
            // 出生地: 级联选择(省/市/区)或手动经纬度
            var lastPlace = null; // 供"串宫押运十二神"跳转带参
            if ($('country').value === 'manual') {
                var mLon = parseFloat(lonIn.value), mLat = parseFloat(latIn.value);
                if (isNaN(mLon) || isNaN(mLat) || mLat < -90 || mLat > 90 || mLon < -180 || mLon > 180) {
                    err.textContent = '请填写有效的经纬度(经度-180~180,纬度-90~90)';
                    return;
                }
                opt.lat = mLat;
                opt.lon = mLon;
                opt.city = undefined;
                lastPlace = { manual: true, lat: mLat, lon: mLon };
            } else {
                var c = null;
                if (pickedSearch) { c = pickedSearch; }
                else if (distSel.value) { c = distMap[parseInt(distSel.value, 10)]; }
                else if (citySel.value) { c = cityMap[parseInt(citySel.value, 10)]; }
                else if (provSel.value) { c = provMap[parseInt(provSel.value, 10)]; }
                if (!c) {
                    err.textContent = '请选择出生地(省/市/区)';
                    return;
                }
                opt.city = c.name;
                opt.lat = c.w;
                opt.lon = c.j;
                lastPlace = { manual: false, name: c.name, path: c.path, lat: c.w, lon: c.j };
            }
            var r = Paipan.computeFull(opt);
            if (!r) {
                err.textContent = '输入无效:请检查日期与城市';
                return;
            }
            var html = buildAll(r);
            for (var k in html) {
                if (html.hasOwnProperty(k)) {
                    $(k).innerHTML = html[k];
                }
            }
            $('result').style.display = '';
            updateGods12Link(lastPlace);
        });

        // "串宫押运十二神 →"跳转链接: 带上本次排盘参数(URL hash),目标页按当前文件名区分开发版/成品
        function updateGods12Link(place) {
            var link = $('toGods12');
            if (!link) {
                return;
            }
            // file:// 下 pathname 是百分号编码的,先解码再判断
            var path2 = (typeof location !== 'undefined') ? decodeURIComponent(location.pathname || '') : '';
            var inDist = path2.indexOf('排盘软件') >= 0;
            var base = inDist ? '十二神.html' : 'gods12.html';
            var p = [];
            p.push('mode=' + $('mode').value);
            p.push('year=' + $('yy').value);
            p.push('month=' + $('mm').value);
            p.push('day=' + $('dd').value);
            p.push('hour=' + $('hh').value);
            p.push('minute=' + ($('mi').value || '0'));
            p.push('leap=' + ($('leap').checked ? '1' : '0'));
            p.push('gender=' + encodeURIComponent(doc.querySelector('input[name=gender]:checked').value));
            p.push('zwz=' + ($('zwz').checked ? '1' : '0'));
            p.push('zty=' + ($('zty').checked ? '1' : '0'));
            p.push('blind=' + ($('blindPaipanTechnique').checked ? '1' : '0'));
            if (place) {
                if (place.manual) {
                    p.push('manual=1');
                    p.push('lat=' + place.lat);
                    p.push('lon=' + place.lon);
                } else {
                    p.push('city=' + encodeURIComponent(place.name || ''));
                    p.push('path=' + encodeURIComponent((place.path || []).join('/')));
                    p.push('lat=' + place.lat);
                    p.push('lon=' + place.lon);
                }
            }
            link.href = base + '#' + p.join('&');
            link.style.display = '';
        }
    }

    return {
        buildAll: buildAll,
        buildBasic: buildBasic, buildPillars: buildPillars, buildJieqi: buildJieqi,
        buildPalaces: buildPalaces, buildDayun: buildDayun, buildGX: buildGX, buildShensha: buildShensha, buildStat: buildStat,
        bind: bind
    };
}));

</script>
<script>PaipanUI.bind(document);</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
